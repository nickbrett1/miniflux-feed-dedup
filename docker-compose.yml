# Docker Compose for miniflux-feed-dedup
#
# Runs the published GHCR image (ghcr.io/nickbrett1/miniflux-feed-dedup), a
# stdlib HTTP server that fetches the upstream eFinancialCareers feed, removes
# duplicate items (same normalized title), and serves the cleaned feed.
#
# Miniflux subscribes to the host port: http://127.0.0.1:8090/rss.xml
# (option a: publish a host port for the consumer to reach it).
#
# Auto-updated by watchtower-nick (scope=nick, 60s poll) on each GHCR publish.

services:
  miniflux-feed-dedup:
    image: ghcr.io/nickbrett1/miniflux-feed-dedup:latest
    container_name: miniflux-feed-dedup
    restart: always
    mem_limit: 64m
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "127.0.0.1:8090:8090"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=nick"
      - "homepage.group=Services"
      - "homepage.name=miniflux-feed-dedup"
      - "homepage.href=http://nas.local:8090/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:8090/healthz"
